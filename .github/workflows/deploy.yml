name: Deploy

# Triggers:
#   • Push to main when relevant paths changed.
#   • Manual dispatch (Actions tab → Run workflow) for ad-hoc redeploys.
#
# What it does:
#   pnpm build && pnpm deploy:all
#
# This applies any pending D1 migrations and deploys every Worker, exactly
# matching the local-machine workflow. See README "Day-to-day usage".
#
# Required secrets:
#   CLOUDFLARE_API_TOKEN — see https://developers.cloudflare.com/workers/wrangler/ci-cd/
#     The token needs Account.Workers Scripts Edit, Account.D1 Edit, and
#     Account.Workers R2 Storage Edit (the last only if you use R2 buckets).
#     Set under repo → Settings → Secrets and variables → Actions → New
#     repository secret → name `CLOUDFLARE_API_TOKEN`.
#
# Optional:
#   CLOUDFLARE_ACCOUNT_ID — usually inferred by wrangler from the token, but
#     can be set explicitly if you have multiple accounts and want to disambiguate.

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'apps/**'
      - 'server/**'
      - 'lib/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Cancel any in-flight deploy when a new commit lands.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:all
